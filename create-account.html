<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account</title>

    <link rel="shortcut icon" href="assets/images/fav-icon.png" type="image/x-icon">
    <link rel="stylesheet" href="assets/css/styles.css">

    <!-- country flag css -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/intl-tel-input/17.0.8/css/intlTelInput.css" />

    <!-- spinner style -->
    <style>
        .btn-spinner {
            width: 18px;
            height: 18px;
            border: 2px solid #1d4ed8;
            border-top: 2px solid transparent;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            display: inline-block;
            margin-right: 8px;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

<div class="kyc_container">

    <!-- mobile header -->
    <div class="mobile_kyc_logo">
        <div class="mobile_kyc_box">
            <img src="assets/images/Paidley-lo.png" alt="paidley mobile logo">
            <img class="partern" src="assets/images/arrow-pattern.png" alt="">
        </div>
    </div>

    <div class="kyc_left">
        <div class="kyc_logo">
            <img src="assets/images/Paidley-lo.png" alt="paidley logo">
        </div>

        <div class="create-image_illustration">
            <img src="assets/images/create-illustration.png" alt="">
        </div>

        <div class="kyc_footer">
            <div class="kyc_footer_main1">
                <p>&copy; Paidley <span class="year"></span></p>
                <div class="kyc_footer_right">
                    <a href="#">Help Center</a>
                    <a href="#">Terms of Service</a>
                </div>
            </div>
        </div>
    </div>

    <div class="kyc_right">
        <div class="create_account-container">
            <div class="create_account_main">

                <div class="top_head">
                    <h2>Create your account</h2>
                    <p>Already have an account? <a href="login.html">Sign in</a></p>
                </div>

                <form id="createAccountForm">

                    <div class="create_account_group1_box">
                        <div class="form-group">
                            <label>First name <span>*</span></label>
                            <input type="text" id="firstName" required>
                        </div>

                        <div class="form-group">
                            <label>Last name <span>*</span></label>
                            <input type="text" id="lastName" required>
                        </div>
                    </div>

                    <div class="create_account_group_bo">
                        <div class="form-group">
                            <label>Middle name</label>
                            <input type="text">
                        </div>

                        <div class="form-group">
                            <label>Date of birth <span>*</span></label>
                            <input type="date" id="dob" required>
                        </div>
                    </div>

                    <div class="create_account_group2_box">
                        <div class="phone-number-box">
                            <label>Phone number <span>*</span></label>
                            <div class="phone-input">
                                <input class="phone_numb" type="tel" id="phoneNumber" required>
                            </div>
                        </div>

                        <div class="form-group2">
                            <label>Email <span>*</span></label>
                            <input type="email" id="email" required>
                        </div>

                        <div class="form-group-image">
                            <label>Password <span>*</span></label>
                            <div class="form-group-image_flex">
                                <input type="password" id="password" required>
                                <img id="createShow" src="assets/images/show-eye.png" alt="">
                                <img id="createHide" src="assets/images/hide-eye.png" alt="">
                            </div>
                        </div>

                        <div class="form-group-image">
                            <label>Confirm password <span>*</span></label>
                            <div class="form-group-image_flex">
                                <input type="password" id="confirmPassword" required>
                                <img id="createShow2" src="assets/images/show-eye.png" alt="">
                                <img id="createHide2" src="assets/images/hide-eye.png" alt="">
                            </div>

                            <div class="password_match" style="display:none;">
                                <p>Password does not match</p>
                            </div>
                        </div>

                        <div class="form-group2">
                            <label>Referral code (optional)</label>
                            <input type="text">
                        </div>
                    </div>

                    <button class="create_account_btn" type="submit" disabled>
                        Create account
                    </button>

                </form>

            </div>
        </div>
    </div>

</div>

<!-- intl tel input -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/intl-tel-input/17.0.8/js/intlTelInput.min.js"></script>

<script>
    const phoneInput = document.querySelector(".phone_numb");
    window.intlTelInput(phoneInput, {
        initialCountry: "ng",
        separateDialCode: true,
    });
</script>

<script>
    document.querySelectorAll(".year").forEach(el => {
        el.textContent = new Date().getFullYear();
    });
</script>

<script>
    const form = document.getElementById("createAccountForm");
    const btn = document.querySelector(".create_account_btn");

    const fields = [
        "firstName",
        "lastName",
        "phoneNumber",
        "dob",
        "email",
        "password",
        "confirmPassword"
    ].map(id => document.getElementById(id));

    const password = document.getElementById("password");
    const confirmPassword = document.getElementById("confirmPassword");
    const error = document.querySelector(".password_match");

    function validate() {
        const filled = fields.every(f => f.value.trim() !== "");
        const match = password.value === confirmPassword.value;

        error.style.display = !match && confirmPassword.value ? "block" : "none";
        btn.disabled = !(filled && match);
    }

    fields.forEach(f => f.addEventListener("input", validate));

    form.addEventListener("submit", e => {
        e.preventDefault();

        btn.disabled = true;
        btn.innerHTML = `<span class="btn-spinner"></span>Creating account...`;

        setTimeout(() => {
            window.location.href = "login.html";
        }, 1500);
    });
</script>

</body>
</html>
