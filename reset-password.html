<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password</title>

    <!-- favicon -->
    <link rel="shortcut icon" href="assets/images/fav-icon.png" type="image/x-icon">

    <!-- css stylesheet -->
    <link rel="stylesheet" href="assets/css/styles.css">

    <!-- spinner style -->
    <style>
        .btn-spinner {
            width: 18px;
            height: 18px;
            border: 2px solid #1d4ed8;
            /* blue */
            border-top: 2px solid transparent;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            display: inline-block;
            vertical-align: middle;
            margin-right: 8px;
        }


        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>

    <div class="reset_password_container">

        <div class="reset_password_left">
            <div class="reset_password_logo">
                <img src="assets/images/Paidley-lo.png" alt="paidley logo">
            </div>

            <div class="reset_password_box">
                <img src="assets/images/reset-password-illustration.png" alt="reset password image">
            </div>

            <div class="kyc_footer">
                <div class="kyc_footer_main1">
                    <p>&copy; Paidley <span class="year"></span></p>
                    <div class="kyc_footer_right">
                        <a href="#">Help Center</a>
                        <a href="#">Terms of Service</a>
                    </div>
                </div>
            </div>
        </div>

        <div class="reset_password_right">
            <div class="reset_password_main">
                <div class="reset_password_right_box">
                    <div class="top-head">
                        <h3>Reset Password</h3>
                        <p>Enter your registered email address to reset your password</p>
                    </div>

                    <form id="resetPasswordForm">
                        <div class="reset_password_email">
                            <label>Email</label>
                            <input type="email" id="email" placeholder="Enter your email address" required>
                            <p class="error-message" id="emailError"></p>
                        </div>

                        <div class="reset_password_bottom">
                            <button class="reset_passwordlogin_btn" type="submit" disabled>
                                Proceed
                            </button>
                            <p>Go back to <a href="login.html">Login</a></p>
                        </div>
                    </form>

                </div>
            </div>
        </div>

    </div>

    <!-- GET YEAR -->
    <script>
        let currentYear = new Date().getFullYear();
        document.querySelectorAll(".year").forEach(el => el.textContent = currentYear);
    </script>

    <!-- ACTIVATE BUTTON WHEN EMAIL HAS VALUE -->
    <script>
        const emailInput = document.getElementById('email');
        const resetBtn = document.querySelector('.reset_passwordlogin_btn');

        emailInput.addEventListener('input', () => {
            resetBtn.disabled = emailInput.value.trim() === '';
        });
    </script>

    <!-- HANDLE SPINNER + REDIRECT -->
    <script>
        const form = document.getElementById('resetPasswordForm');

        form.addEventListener('submit', function (e) {
            e.preventDefault();

            resetBtn.disabled = true;
            resetBtn.innerHTML = `
            <span class="btn-spinner"></span>
            Sending...
        `;

            // Simulate API call
            setTimeout(() => {
                window.location.href = "reset-link-sent.html";
            }, 1500);
        });
    </script>

</body>

</html>
