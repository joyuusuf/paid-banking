<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password</title>

    <!-- favicon -->
    <link rel="shortcut icon" href="assets/images/fav-icon.png" type="image/x-icon">

    <!-- css stylesheet -->
    <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>

    <div class="reset_password_container">
        <!-- mobile login and pattern -->
        <div class="reset_password_mobile_logo">
            <div class="reset_password_bo">
              <img src="assets/images/Paidley-lo.png" alt="reset password mobile logo">
              <img  class="reset_password_mobile_partern" src="assets/images/arrow-pattern.png" alt="reset password mobile logo">
            </div>
        </div>

        <div class="reset_password_left">
            <div class="reset_password_logo">
                <img src="assets/images/Paidley-lo.png" alt="paidley logo">
            </div>

            <div class="reset_password_box">
                <img src="assets/images/reset-password-illustration.png" alt=" reset password mage">
            </div>
            
            <!-- 
            <div class="reset_password_footer">
                <p>&copy; Paidley <span class="year"></span></p>
                <div class="reset_password_footer_right">
                    <a href="#">Help Center</a>
                    <a href="#">Terms of Service</a>
                </div>
            </div> -->

            <div class="kyc_footer">
                <!-- <p>&copy; Paidley <span  class="year"></span></p> -->
                <div class="kyc_footer_main1">
                    <p>&copy; Paidley <span  class="year"></span></p>
                    <div class="kyc_footer_right">
                        <a href="#">Help Center</a>
                        <a href="#">Terms of Service</a>
                    </div>
                </div>
            </div>

        </div>

        <div class="reset_password_right">
            <div class="reset_password_main">
                <div class="reset_password_right_box">
                    <div class="top-head">
                        <h3>Reset Password</h3>
                        <p>Enter your registered email address to reset your password</p>
                    </div>

                    <form action="" id="resetPasswordForm">
                        <div class="reset_password_email">
                            <label>Email</label> 
                            <input type="email" id="email" placeholder="Enter your email address" required>  
                            <p class="error-message" id="emailError"></p>
                        </div>

                        <div class="reset_password_bottom">
                            <button class="reset_passwordlogin_btn" type="button" disabled>Proceed</button>
                            <p>Go back to <a href="login.html">Login</a></p>
                        </div>
                    </form>

                    <!-- <div class="reset_password_bottom">
                        <p>Go back to <a href="login.html">Login</a></p>
                    </div> -->
                </div>
            </div>
        </div>

        <!-- mobile footer section -->
        <div class="reset_password_mobile_footer">
            <div class="reset_password_mobile_footer_box">
                <p>&copy; Paidley <span class="year"></span></p>
                <div class="mobile_footer_flex">
                    <a href="#">Help Center</a>
                    <a href="#">Terms of Service</a>
                </div>
            </div>
        </div>
        
    </div>


    <!-- GET YEAR -->
    <script>
        let currentYear = new Date().getFullYear();
        document.querySelectorAll(".year").forEach(function (element) {
            element.textContent = currentYear;
        });
    </script>


    <!-- ACTIVATE THE BUTTTON WHEN EMAIL INPUT HAS A VALUE -->
    <script>
        const emailInput = document.getElementById('email');
        const resetBtn = document.querySelector('.reset_passwordlogin_btn');

        emailInput.addEventListener('input', () => {
            if (emailInput.value.trim() !== '') {
                resetBtn.disabled = false;
            } else {
                resetBtn.disabled = true;
            }
        });
    </script>

    
</body>
</html>
