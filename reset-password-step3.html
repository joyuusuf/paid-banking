<!DOCTYPE html>

<body>

    <!-- GET YEAR -->
    <script>
        let currentYear = new Date().getFullYear();
        document.querySelectorAll(".year").forEach(function (element) {
            element.textContent = currentYear;
        });
    </script>

    <!-- ENABLE THE BUTTON WHEN THE INPUTS ARE FILLED  -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Variables for the new password input and eye icons
            const newPasswordInput = document.getElementById('newPassword');
            const showNewPasswordIcon = document.getElementById('showNewPassword');
            const hideNewPasswordIcon = document.getElementById('hideNewPassword');

            // Variables for the confirm password input and eye icons
            const confirmPasswordInput = document.getElementById('confirmPassword');
            const showConfirmPasswordIcon = document.getElementById('showConfirmPassword');
            const hideConfirmPasswordIcon = document.getElementById('hideConfirmPassword');

            // Variable for the reset button
            const resetButton = document.querySelector('.reset_btn');

            // Function to toggle password visibility
            function togglePassword(input, showIcon, hideIcon) {
                showIcon.addEventListener('click', () => {
                    input.type = 'text';
                    showIcon.style.display = 'none';
                    hideIcon.style.display = 'inline-block';
                });

                hideIcon.addEventListener('click', () => {
                    input.type = 'password';
                    hideIcon.style.display = 'none';
                    showIcon.style.display = 'inline-block';
                });
            }

            // Function to enable the reset button when both fields are filled
            function enableResetButton() {
                if (newPasswordInput.value && confirmPasswordInput.value) {
                    resetButton.disabled = false;
                } else {
                    resetButton.disabled = true;
                }
            }

            // Toggle visibility for the new password field
            togglePassword(newPasswordInput, showNewPasswordIcon, hideNewPasswordIcon);

            // Toggle visibility for the confirm password field
            togglePassword(confirmPasswordInput, showConfirmPasswordIcon, hideConfirmPasswordIcon);

            // Event listeners for enabling the reset button when inputs are filled
            newPasswordInput.addEventListener('input', enableResetButton);
            confirmPasswordInput.addEventListener('input', enableResetButton);
        });

    </script>


    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const newPasswordInput = document.getElementById('newPassword');
            const confirmPasswordInput = document.getElementById('confirmPassword');

            const showNewPasswordIcon = document.getElementById('showNewPassword');
            const hideNewPasswordIcon = document.getElementById('hideNewPassword');
            const showConfirmPasswordIcon = document.getElementById('showConfirmPassword');
            const hideConfirmPasswordIcon = document.getElementById('hideConfirmPassword');

            const resetButton = document.querySelector('.reset_btn');
            const btnText = document.querySelector('.btn-text');
            const btnSpinner = document.querySelector('.btn-spinner');

            function togglePassword(input, showIcon, hideIcon) {
                showIcon.addEventListener('click', () => {
                    input.type = 'text';
                    showIcon.style.display = 'none';
                    hideIcon.style.display = 'inline-block';
                });

                hideIcon.addEventListener('click', () => {
                    input.type = 'password';
                    hideIcon.style.display = 'none';
                    showIcon.style.display = 'inline-block';
                });
            }

            togglePassword(newPasswordInput, showNewPasswordIcon, hideNewPasswordIcon);
            togglePassword(confirmPasswordInput, showConfirmPasswordIcon, hideConfirmPasswordIcon);

            function validatePasswords() {
                const newPass = newPasswordInput.value.trim();
                const confirmPass = confirmPasswordInput.value.trim();

                resetButton.disabled = !(newPass && confirmPass && newPass === confirmPass);
            }

            newPasswordInput.addEventListener('input', validatePasswords);
            confirmPasswordInput.addEventListener('input', validatePasswords);

            resetButton.addEventListener('click', (e) => {
                e.preventDefault();

                // show spinner
                btnText.style.display = 'none';
                btnSpinner.style.display = 'inline-block';
                resetButton.disabled = true;

                // simulate request, then redirect
                setTimeout(() => {
                    window.location.href = "login.html";
                }, 1500);
            });
        });
    </script>


</body>
