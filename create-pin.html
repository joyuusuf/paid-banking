  <!-- GET YEAR -->
  <script>
    let currentYear = new Date().getFullYear();
    document.querySelectorAll(".year").forEach(function (element) {
      element.textContent = currentYear;
    });
  </script>


  <script>
    // Variables for readability
    const pinInputs = document.querySelectorAll('.pin-input');
    const pinInputs2 = document.querySelectorAll('.pin-input2');
    const createPinBtn = document.querySelector('.create_pin_btn');
      
    // Function to validate if PIN and confirm PIN match
    function validatePinMatch() {
        let pin = '';
        let confirmPin = '';
      
        pinInputs.forEach(input => pin += input.value);
        pinInputs2.forEach(input => confirmPin += input.value);
      
        // if (pin === confirmPin && pin.length === 6 && confirmPin.length === 6) {
        //   createPinBtn.disabled = false;   
        // } else {
        //   createPinBtn.disabled = true;  
        // }

        if (pin === confirmPin && pin.length === 4 && confirmPin.length === 4) {
          createPinBtn.disabled = false;   
        } else {
          createPinBtn.disabled = true;  
        }
      }
        
    // Function to move focus to the next input
    function moveToNextInput(currentInput, inputArray) {
      const currentIndex = Array.from(inputArray).indexOf(currentInput);
      if (currentInput.value !== '' && currentIndex < inputArray.length - 1) {
        inputArray[currentIndex + 1].focus(); // Move to the next input
      }
    }
    
    // Function to move focus to the previous input on backspace
    function moveToPreviousInput(currentInput, inputArray) {
      const currentIndex = Array.from(inputArray).indexOf(currentInput);
      if (currentIndex > 0 && currentInput.value === '') {
        inputArray[currentIndex - 1].focus(); // Move to the previous input
      }
    }
  
    // Add event listeners to pin inputs
    pinInputs.forEach(input => {
    input.addEventListener('input', (e) => {
      if (!/^[0-9]$/.test(e.target.value)) {
        e.target.value = ''; // Allow only numbers
      }
      moveToNextInput(input, pinInputs); // Move to the next input
      validatePinMatch();  // Validate pin match on each input
    });
  
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Backspace') {
        moveToPreviousInput(input, pinInputs); // Move back on backspace
      }
    });
  });
    
    // Add event listeners to confirm pin inputs
    pinInputs2.forEach(input => {
      input.addEventListener('input', (e) => {
        if (!/^[0-9]$/.test(e.target.value)) {
          e.target.value = ''; // Allow only numbers
        }
        moveToNextInput(input, pinInputs2); // Move to next input
        validatePinMatch(); // Validate pin match after each input
      });
    
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Backspace') {
          moveToPreviousInput(input, pinInputs2); // Move back on backspace
        }
      });
    });
  </script>
