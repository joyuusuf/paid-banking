<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <!-- favicon -->
    <link rel="shortcut icon" href="assets/images/fav-icon.png" type="image/x-icon">

    <!-- css stylesheet -->
    <link rel="stylesheet" href="assets/css/styles.css">

    <!-- spinner style -->
    <style>
        .btn-spinner {
            width: 18px;
            height: 18px;
            border: 2px solid #1d4ed8;
            border-top: 2px solid transparent;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            display: inline-block;
            vertical-align: middle;
            margin-right: 8px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

<div class="login_container">

    <!-- mobile login -->
    <div class="mobile_login_logo">
        <div class="mobile_login_box">
            <img src="assets/images/Paidley-lo.png" alt="login mobile logo">
            <img class="mobile_login_partern" src="assets/images/arrow-pattern.png" alt="mobile login pattern">
        </div>
    </div>

    <div class="login_left">
        <div class="login_logo">
            <img src="assets/images/Paidley-lo.png" alt="paidley logo">
        </div>

        <div class="login_box">
            <img src="assets/images/login-illustration.png" alt="login illustration">
        </div>

        <div class="login_footer">
            <div class="login_footer_right">
                <p>&copy; Paidley <span class="year"></span></p>
                <div class="box">
                    <a href="#">Help Center</a>
                    <a href="#">Terms of Service</a>
                </div>
            </div>
        </div>
    </div>

    <div class="login_right">
        <div class="login_main">
            <div class="login_right_box">

                <div class="top-head">
                    <h3>Log in</h3>
                    <p>Log in to take control of your finances today.</p>
                </div>

                <form id="loginForm">
                    <div class="login_email">
                        <label>Email</label>
                        <input type="email" id="email" placeholder="Enter your email address" required>
                    </div>

                    <div class="login_password_box">
                        <label>Password</label>
                        <div class="password_flex">
                            <input type="password" id="password" placeholder="Enter your password" required>
                            <img class="show" id="show" src="assets/images/show-eye.png" alt="show eye">
                            <img class="hide" id="hide" src="assets/images/hide-eye.png" alt="hide eye">
                        </div>
                    </div>

                    <div class="login_flex">
                        <button class="login_btn" type="submit" disabled>
                            Login
                        </button>
                        <p>Forgot password? <a href="reset-password.html">Reset here</a></p>
                    </div>
                </form>

                <div class="login_bottom">
                    <p>Don’t have an account? <a href="create-account.html">Create account</a></p>
                </div>

            </div>
        </div>
    </div>

    <!-- mobile footer -->
    <div class="mobile_login_footer">
        <div class="mobile_login_footer_box">
            <p>&copy; Paidley <span class="year"></span></p>
            <div class="mobile_login_footer_right">
                <a href="#">Help Center</a>
                <a href="#">Terms of Service</a>
            </div>
        </div>
    </div>

</div>

<!-- year -->
<script>
    document.querySelectorAll(".year").forEach(el => {
        el.textContent = new Date().getFullYear();
    });
</script>

<!-- login logic -->
<script>
    const emailField = document.getElementById("email");
    const passwordField = document.getElementById("password");
    const loginButton = document.querySelector(".login_btn");
    const loginForm = document.getElementById("loginForm");
    const showIcon = document.getElementById("show");
    const hideIcon = document.getElementById("hide");

    function togglePassword() {
        showIcon.onclick = () => {
            passwordField.type = "text";
            showIcon.style.display = "none";
            hideIcon.style.display = "inline-block";
        };

        hideIcon.onclick = () => {
            passwordField.type = "password";
            hideIcon.style.display = "none";
            showIcon.style.display = "inline-block";
        };
    }

    function enableButton() {
        loginButton.disabled = !(emailField.value.trim() && passwordField.value.trim());
    }

    emailField.addEventListener("input", enableButton);
    passwordField.addEventListener("input", enableButton);

    loginForm.addEventListener("submit", function (e) {
        e.preventDefault();

        loginButton.disabled = true;
        loginButton.innerHTML = `<span class="btn-spinner"></span>Logging in...`;

        setTimeout(() => {
            window.location.href = "client-dashboard/index.html";
        }, 1500);
    });

    togglePassword();
</script>

</body>
</html>
